    let activeIdx = 0;

    function renderSidebar() {
      const container = document.getElementById("sidebar-nav-container");
      let currentSection = "";
      let html = "";

      SLIDES.forEach((s, idx) => {
        if (s.section !== currentSection) {
          currentSection = s.section;
          html += `<div class="deck-section-label">${currentSection}</div>`;
        }
        const isActive = idx === activeIdx ? "active" : "";
        html += `
          <button class="deck-nav-item ${isActive}" onclick="selectSlide(${idx})">
            <span class="deck-nav-num">${s.num}</span>
            <span class="truncate">${s.navTitle}</span>
          </button>
        `;
      });
      container.innerHTML = html;
    }

    function renderSlide() {
      const s = SLIDES[activeIdx];
      const root = document.getElementById("slide-render-root");

      const metricsHtml = s.metrics.map(m => `
        <div class="slide-card flex flex-col justify-between">
          <div class="text-2xl md:text-3xl font-black text-amber-500 tracking-tight">${m.val}</div>
          <div class="text-xs text-zinc-400 font-semibold mt-2 uppercase tracking-wider">${m.lbl}</div>
        </div>
      `).join("");

      const cardsHtml = s.cards.map(c => `
        <div class="slide-card flex flex-col gap-3">
          <div>
            <span class="text-xs font-mono font-bold text-amber-400 uppercase tracking-widest">${c.tag}</span>
            <h3 class="text-lg font-bold text-white mt-1">${c.head}</h3>
          </div>
          <p class="text-sm text-zinc-300 leading-relaxed whitespace-pre-line m-0">${c.body}</p>
        </div>
      `).join("");

      root.innerHTML = `
        <div class="max-w-5xl">
          <div class="flex items-center justify-between flex-wrap gap-3 mb-4">
            <span class="kpi-pill">${s.badge}</span>
            <span class="text-xs font-mono text-zinc-400">${s.section}</span>
          </div>
          <h1 class="text-3xl md:text-4xl font-black text-white tracking-tight leading-tight mb-3">
            ${s.title}
          </h1>
          <p class="text-base text-zinc-300 leading-relaxed max-w-4xl mb-8">
            ${s.subtitle}
          </p>

          <!-- 4 Key Metrics Row -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            ${metricsHtml}
          </div>

          <!-- 3 Detailed Pillar Cards -->
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
            ${cardsHtml}
          </div>
        </div>
      `;

      document.getElementById("footer-slide-counter").textContent = `SLIDE ${s.num} / 12`;
      document.getElementById("footer-section-title").textContent = s.section;
    }

    function selectSlide(idx) {
      activeIdx = idx;
      renderSidebar();
      renderSlide();
    }

    function nextSlide() {
      selectSlide((activeIdx + 1) % SLIDES.length);
    }

    function prevSlide() {
      selectSlide((activeIdx - 1 + SLIDES.length) % SLIDES.length);
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "ArrowDown") nextSlide();
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") prevSlide();
    });

    renderSidebar();
    renderSlide();
  </script>
